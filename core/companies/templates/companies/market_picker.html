<form method="get" action="{% url 'market:list' %}" class="am-market__picker" data-market-picker
      data-options-url="{% url 'market:variety-options' %}">
    {% if selected_hub %}<input type="hidden" name="hub" value="{{ selected_hub }}">{% endif %}
    <label>Культура
        <select name="category" class="form-select">
            <option value="">Усі категорії</option>
            {% for item in categories %}
                <option value="{{ item.slug }}" {% if category.pk == item.pk %}selected{% endif %}>{{ item.market_label }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Сорт
        <select name="variety" class="form-select">
            <option value="">Усі сорти</option>
            {% for item in picker_varieties %}
                <option value="{{ item.id }}" {% if variety.pk == item.id %}selected{% endif %}>{{ item.title }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Регіон компанії
        <select name="region" class="form-select">
            <option value="">Усі регіони</option>
            {% for item in regions %}
                <option value="{{ item.pk }}" {% if selected_region == item.pk|stringformat:"s" %}selected{% endif %}>{{ item.value }}</option>
            {% endfor %}
        </select>
    </label>
    <button type="submit" class="am-market__button am-market__button--primary">Показати ↓</button>
</form>
