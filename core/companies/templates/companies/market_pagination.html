{% if page_obj.has_other_pages %}
    <nav class="d-flex gap-3 my-4" aria-label="Сторінки результатів">
        {% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}">← Попередня</a>{% endif %}
        <span>{{ page_obj.number }} / {{ paginator.num_pages }}</span>
        {% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}">Наступна →</a>{% endif %}
    </nav>
{% endif %}
