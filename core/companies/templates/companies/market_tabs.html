{% if crop_hub_category %}<p>Культура: <a href="{{ crop_hub_category.absolute_url }}">{{ crop_hub_category.value }}</a></p>{% endif %}
<nav class="site-segmented-control" aria-label="Розділи Агромаркету">
    <a class="site-segmented-control__item{% if market_tab == 'products' %} is-active{% endif %}"
       href="{% url 'market:list' %}{% if request.GET.hub %}?hub={{ request.GET.hub|urlencode }}{% endif %}"
       {% if market_tab == 'products' %} aria-current="page"{% endif %}>Товари</a>
    <a class="site-segmented-control__item{% if market_tab == 'companies' %} is-active{% endif %}"
       href="{% url 'companies:list' %}{% if request.GET.hub %}?hub={{ request.GET.hub|urlencode }}{% endif %}"
       {% if market_tab == 'companies' %} aria-current="page"{% endif %}>Компанії</a>
</nav>
