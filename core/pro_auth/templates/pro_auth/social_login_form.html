<form method="post" action="{% url 'social:begin' backend %}" class="m-0">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit" class="{{ button_class }}">
        {% if icon_class %}<i class="{{ icon_class }}"></i>{% endif %}
        {{ label }}
    </button>
</form>
